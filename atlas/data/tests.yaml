- id: eswt-barbotage-calcific
  type: info
  title: Extracorporeal Shock Wave Therapy (ESWT) & Barbotage for Calcific Tendinopathy
  page: 6
  summary: Systematic reviews (Bannuru 2014, Surace 2020 Cochrane), BESS/BOA guideline recommendation, and sham-controlled
    BMJ trial of ultrasound-guided lavage/barbotage (Moosmayer 2023).
  steps:
  - 'Bannuru 2014 Ann Intern Med (MA, 28 RCTs): high-energy ESWT better than placebo for pain, function and calcium
    resorption in calcific tendinitis; no difference vs placebo in non-calcific tendinitis.'
  - 'Surace 2020 Cochrane (32 trials): vs placebo at 3 months: pain 0.78 better (0.17–1.4) on 0–10, below the 1.5
    clinically important change; function 7.9 better (1.6–14), below 10 → benefit may not be clinically important.'
  - 'BESS/BOA pathway (Kulkarni 2015): "Extracorporeal shock wave therapy may improve pain in calcific tendonitis."'
  - 'Barbotage / ultrasound-guided lavage RCT (Moosmayer 2023 BMJ, n = 218): OSS at 4 months: lavage + steroid vs
    sham 0.2 (−2.3 to 2.8); none superior to sham at 24 months.'
  positive: 'ESWT: high-energy ESWT better than placebo in calcific tendinitis, no difference in non-calcific (Bannuru
    2014); vs placebo at 3 months pain 0.78 better (0.17–1.4) on 0–10 (below 1.5), function 7.9 better (1.6–14,
    below 10) (Surace 2020). Barbotage (n = 218): OSS at 4 months lavage + steroid vs sham 0.2 (−2.3 to 2.8); none
    superior to sham at 24 months (Moosmayer 2023).'
  interpretation: Do not use ESWT for non-calcific rotator cuff tendinopathy; in calcific tendinopathy, high-energy
    ESWT may improve pain ("Extracorporeal shock wave therapy may improve pain in calcific tendonitis."), whereas
    ultrasound-guided lavage + steroid was no better than sham at 4 or 24 months (Moosmayer 2023).
  metrics: 'Moosmayer 2023 BMJ (RCT, n = 218, Level H): OSS at 4 months: lavage + steroid vs sham 0.2 (−2.3 to 2.8);
    none superior to sham at 24 months. Bannuru 2014 Ann Intern Med (MA, 28 RCTs, Level M): high-energy ESWT better
    than placebo for pain, function and calcium resorption in calcific tendinitis; no difference vs placebo in non-calcific
    tendinitis. Surace 2020 Cochrane (32 trials, Level M): vs placebo at 3 months: pain 0.78 better (0.17–1.4) on
    0–10, below the 1.5 clinically important change; function 7.9 better (1.6–14), below 10 → benefit may not be
    clinically important. Kulkarni 2015 BESS/BOA (Guideline): "Extracorporeal shock wave therapy may improve pain
    in calcific tendonitis."'
  evidence: H
