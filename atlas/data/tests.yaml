  steps:
  - 'Impingement cluster: perform Hawkins-Kennedy + Painful arc + Infraspinatus (ER resistance) test.'
  - 'Full-thickness tear cluster: perform Painful arc + Drop-arm + Infraspinatus (ER resistance) test.'
