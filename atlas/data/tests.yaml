- id: mt-frozen-shoulder
  type: info
  title: 'Frozen Shoulder: Manual Therapy, High-Grade Mobilisation & Supervised Neglect (Page 2014, Vermeulen &
    Diercks)'
  page: 7
  summary: Cochrane review comparing manual therapy + exercise vs glucocorticoid injection (Page 2014), RCT of high-grade
    vs low-grade mobilisation (Vermeulen 2006), and cohort study of supervised neglect vs intensive stretching beyond
    pain threshold (Diercks 2004).
  steps:
  - 'Page 2014 Cochrane: at 7 weeks, manual therapy + exercise probably results in less improvement than glucocorticoid
    injection (pain MD 26 points, 15–37, on 100).'
  - 'Vermeulen 2006 Phys Ther (stiff/frozen phase): high-grade mobilisation techniques (HGMT) were more effective
    than low-grade mobilisation for mobility and disability, though overall differences were small.'
  - 'Diercks 2004 J Shoulder Elbow Surg: Constant ≥ 80 at 24 months was achieved in 89% with supervised neglect
    (pendulum/pain-free active movement + reassurance) vs 63% with intensive physical therapy stretching beyond
    the pain threshold (64% within 12 months).'
  - Match mobilisation intensity to tissue irritability (Kelley 2013 JOSPT CPG).
  positive: 'Page 2014 Cochrane: at 7 weeks probably less improvement than glucocorticoid injection (pain MD 26
    points, 15–37, on 100). Vermeulen 2006: HGMT more effective for mobility and disability; overall differences
    small. Diercks 2004: Constant ≥ 80 at 24 months: 89% supervised neglect vs 63% intensive; 64% within 12 months.'
  interpretation: Avoid aggressive stretching beyond the pain threshold in irritable frozen shoulders (Diercks 2004);
    reserve high-grade end-range mobilisation for low-irritability stiff shoulders (Vermeulen 2006).
