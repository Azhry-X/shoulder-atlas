- id: bear-hug-test
  type: test
  title: Bear-Hug Test (Subscapularis)
  page: 4
  summary: Resisted anterior internal rotation with the palm on the contralateral shoulder and elbow elevated anteriorly
    to test upper and lower subscapularis fibres.
  steps:
  - Place the palm of the affected hand flat on the opposite shoulder with the fingers extended and the elbow positioned
    anteriorly in front of the body.
  - Ask the patient to hold the palm pressed down on the shoulder while you apply an external rotation force perpendicular
    to the forearm to lift the palm off.
  - Compare strength against the contralateral side.
  positive: bear-hug Sn 60%, Sp 91.7%; belly-press Sn 40%, Sp 97.9%; Napoleon Sn 25%, Sp 97.9%; lift-off Sn 17.6%,
    Sp 100% (Barth 2006).
  interpretation: Most sensitive of the 4 clinical subscapularis tests in Barth 2006 (Sn 60% while retaining Sp
    91.7%).
  metrics: 'Barth 2006 Arthroscopy: bear-hug Sn 60%, Sp 91.7%; belly-press Sn 40%, Sp 97.9%; Napoleon Sn 25%, Sp
    97.9%; lift-off Sn 17.6%, Sp 100%.'
  evidence: L
  video_url: https://www.youtube.com/watch?v=30C3DNq-w4g
  video_title: Bear Hug Test — Subscapularis Tear (Physiotutors)
