  title: BESS/BOA Shoulder Red Flags & Urgent Referral Pathway
  page: 1
  summary: British Elbow and Shoulder Society / British Orthopaedic Association (BESS/BOA) primary care triage gate
    for suspected joint infection, unreduced dislocation, malignancy, and acute traumatic rotator cuff tear.
  steps:
