  review_status: approved
- id: belly-press-test
  type: test
  title: Belly-Press & Napoleon Tests (Subscapularis)
  page: 4
  summary: Active internal rotation pressure of the palm against the abdomen while maintaining the wrist neutral
    and elbow anterior to the trunk.
  steps:
  - Place the patient’s palm flat against the abdomen just below the xiphoid process with the elbow brought forward
    in front of the coronal plane.
  - Instruct the patient to press the abdomen inward while keeping the wrist straight (0° flexion) and the elbow
    forward.
  - Observe whether the elbow drops posteriorly behind the trunk or the wrist flexes (Napoleon sign) to compensate.
  positive: belly-press Sn 40%, Sp 97.9%; Napoleon Sn 25%, Sp 97.9% (Barth 2006).
  interpretation: Very high specificity (Sp 97.9%) and executable even when internal rotation ROM is too restricted
    for the hand-behind-back lift-off position.
  metrics: 'Barth 2006 Arthroscopy: bear-hug Sn 60%, Sp 91.7%; belly-press Sn 40%, Sp 97.9%; Napoleon Sn 25%, Sp
    97.9%; lift-off Sn 17.6%, Sp 100%.'
  evidence: L
  video_url: https://www.youtube.com/watch?v=RDfStbLsj6Q
  video_title: Belly Press Test / Abdominal Compression — Subscapularis (Physiotutors)
