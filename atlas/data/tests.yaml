- id: speeds-test
  type: test
  title: Speed’s Test (Biceps Tendon / SLAP)
  page: 4
  summary: Resisted isometric shoulder forward flexion with the forearm supinated and elbow extended to provoke
    bicipital groove or superior labral pain.
  steps:
  - Position the patient’s shoulder in forward flexion with the elbow fully extended and forearm supinated (palm
    up).
  - Apply downward isometric resistance at the distal forearm while palpating the bicipital groove.
  - Record reproduction of concordant anterior bicipital groove or deep superior glenohumeral pain.
  positive: Speed Sn 32%, Sp 75%, LR+ 1.28, LR− 0.91 (Holtby 2004).
  interpretation: Likelihood ratios close to 1.0 (LR+ 1.28, LR− 0.91) indicate very limited standalone diagnostic
    utility.
  metrics: 'Holtby 2004 Arthroscopy: Speed Sn 32%, Sp 75%, LR+ 1.28, LR− 0.91; Yergason Sn 43%, Sp 79%, LR+ 2.05,
    LR− 0.72.'
