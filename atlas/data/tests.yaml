  - 'Harms & health economics in UK FROST: capsular release had 8 serious adverse events, MUA had 2; MUA was the
    most cost-effective intervention.'
  - 'MUA + home exercise vs home exercise alone (Kivimäki 2007): no difference in pain or working ability at any
    time; small ROM gains with MUA.'
  positive: 'UK FROST (n = 503): 12-month OSS: capsular release 40.3, MUA 38.3, early structured physio 37.2; all
