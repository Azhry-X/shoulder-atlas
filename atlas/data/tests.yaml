- id: cadogan-subacromial-cluster
  type: test
  title: Cadogan Full Passive ER Rule & Primary Care Subacromial Pain Cluster
  page: 2
  summary: Primary care diagnostic rule separating subacromial pain from stiff shoulder / arthropathy, plus a 3-feature
    history/exam cluster for subacromial anaesthetic response and ultrasound supraspinatus tear.
  steps:
  - 'Assess passive external rotation (ER) bilaterally: full passive ER has Sn 99%, LR− 0.14 for subacromial pain
    → loss of passive ER argues against subacromial pain.'
  - Note that patients with passive ER loss had more glenohumeral arthropathy on X-ray (17% vs 3%).
  - 'Evaluate the 3-item subacromial pain cluster: anterior shoulder pain + strain injury + no symptoms at end-range
    ER in abduction.'
  positive: 'full passive ER: Sn 99%, LR− 0.14 → loss of passive ER argues against subacromial pain; those with
    ER loss had more GH arthropathy on X-ray (17% vs 3%). Cluster (anterior shoulder pain + strain injury + no symptoms
    at end-range ER in abduction): Sp 100% (LR+ ∞, 2.9–∞); full-thickness supraspinatus tear on US: Sp 98% (94–100),
    LR+ 6.2 (1.5–25.7); 34% had a positive subacromial anaesthetic response.'
  interpretation: Loss of passive external rotation strongly argues against isolated subacromial pain (Sn 99%, LR−
    0.14) and points toward adhesive capsulitis or glenohumeral osteoarthritis.
  metrics: 'Cadogan 2016 PLoS One: full passive ER: Sn 99%, LR− 0.14 → loss of passive ER argues against subacromial
    pain; those with ER loss had more GH arthropathy on X-ray (17% vs 3%). Subacromial pain cluster: anterior shoulder
    pain + strain injury + no symptoms at end-range ER in abduction: Sp 100% (LR+ ∞, 2.9–∞); full-thickness supraspinatus
    tear on US: Sp 98% (94–100), LR+ 6.2 (1.5–25.7); 34% had a positive subacromial anaesthetic response.'
  evidence: M
  sources:
  - &id008
    text: Cadogan 2016 PLoS One
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5147961/
    free_full_text: true
  review_status: approved
- id: frozen-shoulder-kelley-cpg
  type: info
  title: Frozen Shoulder (Adhesive Capsulitis) — Prevalence, Risk Factors, 4 Stages & ER-Loss Definition (Kelley
    CPG)
  page: 2
  summary: JOSPT Clinical Practice Guideline (Kelley 2013) diagnostic definition, metabolic/demographic risk factors,
    4 clinical stages, and patient education principles for adhesive capsulitis.
  steps:
  - 'Diagnostic definition: ROM loss > 25% in at least 2 planes AND passive ER loss > 50% of the other side or <
    30° ER.'
  - 'Screen epidemiology & risk factors: shoulder pain 2.4–26%; primary adhesive capsulitis 2% to 5.3%; secondary
    (diabetes/thyroid) 4.3%–38%; diabetes in women 23.7% vs 4.7% and men 38.0% vs 6.5%; hypothyroidism (women) 21.1%
    vs 7.9%; age 40–65, peak 51–55; contralateral risk 5%–34%, bilateral simultaneous up to 14%.'
  - 'Stage the presentation across the 4 stages: stage 1 up to 3 months; stage 2 "freezing" 3–9 months; stage 3
    "frozen" 9–15 months; stage 4 "thawing" 15–24 months; mild symptoms may persist for years.'
  - 'JOSPT CPG education: educate on natural course, activity modification, and match stretching intensity to irritability.'
  positive: ROM loss > 25% in at least 2 planes AND passive ER loss > 50% of the other side or < 30° ER.
  interpretation: Match manual therapy and stretching intensity to tissue irritability across the 4 stages; consider
    intra-articular corticosteroid injection combined with shoulder mobility and stretching exercises in high-irritability
    early stages (Page 6).
  metrics: 'Level: Guideline. Kelley 2013 JOSPT CPG: shoulder pain 2.4–26%; primary adhesive capsulitis 2% to 5.3%;
    secondary (diabetes/thyroid) 4.3%–38%; diabetes in women 23.7% vs 4.7% and men 38.0% vs 6.5%; hypothyroidism
    (women) 21.1% vs 7.9%; age 40–65, peak 51–55; contralateral risk 5%–34%, bilateral simultaneous up to 14%. Stages:
    stage 1 up to 3 months; stage 2 "freezing" 3–9 months; stage 3 "frozen" 9–15 months; stage 4 "thawing" 15–24
    months; mild symptoms may persist for years. Definition: ROM loss > 25% in at least 2 planes AND passive ER
    loss > 50% of the other side or < 30° ER.'
  evidence: Guideline
  sources:
  - &id015
    text: Kelley 2013 JOSPT CPG
    url: https://doi.org/10.2519/jospt.2013.0302
    free_full_text: false
  review_status: approved
- id: stanmore-atraumatic-instability
  type: info
  title: Atraumatic Shoulder Instability — Stanmore Classification (Polar Types II & III)
  page: 2
  summary: BESS/BOA pathway classification for atraumatic shoulder instability across the Stanmore triangle (polar
    types II and III).
  steps:
  - Distinguish traumatic structural instability (Stanmore polar type I) from atraumatic instability.
  - Identify Stanmore polar type II (atraumatic structural / hyperlaxity) vs polar type III (abnormal muscle patterning,
    structurally normal).
  - Prioritise scapular and rotator cuff motor control rehabilitation (such as the Watson MDI programme on Page
    8) rather than early surgery in polar types II and III.
  positive: Stanmore polar types II (hyperlaxity) and III (muscle patterning, structurally normal).
  interpretation: Patients can migrate between polar groups over time; rehabilitation of kinetic-chain, scapular,
    and cuff control is the primary management for types II and III.
  metrics: 'Level: Guideline. Noorani 2019 BESS/BOA atraumatic instability pathway: Stanmore polar types II (hyperlaxity)
    and III (muscle patterning, structurally normal).'
  evidence: Guideline
  sources:
  - text: Noorani 2019 BESS/BOA atraumatic instability pathway
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6348586/
    free_full_text: true
  review_status: approved
- id: traumatic-instability-recurrence
  type: info
  title: Traumatic Anterior Instability — Recurrence Risk & Immobilisation Evidence
  page: 2
  summary: BESS/BOA guideline prognosis for recurrent instability following first-time traumatic anterior shoulder
    dislocation.
  steps:
  - 'Stratify recurrence risk by age and sex: males under 20 have ≈ 72% chance of recurrent instability.'
  - 'Monitor closely over the first 24 months: almost 90% of recurrences occur within 2 years.'
  - 'Avoid prolonged sling immobilisation for recurrence prevention: immobilisation > 1 week does not reduce recurrence.'
  positive: almost 90% of recurrences within 2 years; males under 20 ≈ 72% chance of recurrent instability; immobilisation
    > 1 week does not reduce recurrence.
  interpretation: Young collision and overhead athletes have high recurrence rates after primary traumatic dislocation;
    counsel early regarding rehabilitation vs surgical stabilisation (Page 5).
  metrics: 'Level: Guideline. Brownson 2015 BESS/BOA traumatic anterior instability pathway: almost 90% of recurrences
    within 2 years; males under 20 ≈ 72% chance of recurrent instability; immobilisation > 1 week does not reduce
    recurrence.'
  evidence: Guideline
  sources:
  - *id003
  review_status: approved
- id: physical-tests-cochrane-hanchard
  type: info
  title: Diagnostic Accuracy Caution for Isolated Shoulder Physical Tests (Cochrane & Meta-Analyses)
  page: 2
  summary: High-level evidence synthesis from Cochrane (Hanchard 2013) and meta-analyses (Hegedus 2008, Gismervik
    2017) on the limitations of isolated special tests.
  steps:
  - 'Cochrane review (Hanchard 2013): insufficient evidence to base selection of physical tests in primary care.'
  - 'AC joint & impingement meta-analysis (Hegedus 2008): no impingement or AC-joint test showed significant diagnostic
    accuracy (2008 meta-analysis).'
  - 'SLAP meta-analysis (Gismervik 2017): pooled DOR of physical tests 1.38 (1.13–1.69) — poor.'
  - Interpret special tests within validated test clusters (Michener, Park, Murrell) and alongside patient history
    and passive ER status.
  positive: insufficient evidence to base selection of physical tests in primary care (Hanchard 2013 Cochrane);
    no impingement or AC-joint test showed significant diagnostic accuracy (Hegedus 2008 BJSM); pooled DOR of physical
    tests 1.38 (1.13–1.69) — poor (Gismervik 2017).
  interpretation: Do not rely on any single orthopaedic special test in isolation to make a structural pathoanatomical
    diagnosis.
  metrics: 'Hanchard 2013 Cochrane (Level H): insufficient evidence to base selection of physical tests in primary
    care. Hegedus 2008 BJSM (Level M): no impingement or AC-joint test showed significant diagnostic accuracy (2008
    meta-analysis). Gismervik 2017 BMC Musculoskelet Disord (Level M): pooled DOR of physical tests 1.38 (1.13–1.69)
    — poor.'
  evidence: H
  sources:
  - text: Hanchard 2013 Cochrane
