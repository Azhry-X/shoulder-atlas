- id: oxford-shoulder-score
  type: info
  title: Oxford Shoulder Score (OSS)
  page: 4
  summary: 12-item patient-reported shoulder pain and function questionnaire scored 0–4 per item (total 0–48, higher
    = better function).
  steps:
  - Patient rates 12 pain and daily activity items over the past 4 weeks from 0 (worst / impossible) to 4 (no pain
    / no trouble).
  - Sum all 12 items for a total score of 0–48 (higher score = better shoulder status).
  - Compare longitudinal improvement against Fang 2024 thresholds (MCIC 6.50 mean-change; 8.42 predictive; "at least
    eight points" meaningful).
  positive: MCIC 6.50 (4.41–8.61) mean-change; 8.42 predictive; "at least eight points" meaningful (Fang 2024).
  interpretation: Primary outcome scale in CSAW (Beard 2018), UK FROST (Rangan 2020), and the Moosmayer 2023 barbotage
    RCT.
  metrics: 'Fang 2024 Arthritis Care Res (after shoulder replacement): MCIC 6.50 (4.41–8.61) mean-change; 8.42 predictive;
    "at least eight points" meaningful.'
  evidence: M
  calculator:
    kind: scale
    items: 12
    min: 0
    max: 4
    order: desc
    note: '12 items scored 0–4 (4 = no trouble / none … 0 = impossible / unbearable; total 0–48, higher = better).
      Fang 2024: MCIC 6.50 (4.41–8.61) mean-change; 8.42 predictive; "at least eight points" meaningful.'
    item_labels:
    - Worst pain from your shoulder (4 = None … 0 = Unbearable)
    - Trouble dressing yourself because of your shoulder (4 = No trouble … 0 = Impossible)
    - Trouble getting in and out of a car or using public transport (4 = No trouble … 0 = Impossible)
    - Able to use a knife and fork at the same time (4 = Yes, easily … 0 = No, impossible)
    - Could you do the household shopping on your own? (4 = Yes, easily … 0 = No, impossible)
    - Could you carry a tray of food across a room? (4 = Yes, easily … 0 = No, impossible)
    - Could you brush or comb your hair with the affected arm? (4 = Yes, easily … 0 = No, impossible)
    - How would you describe the pain you usually had from your shoulder? (4 = None … 0 = Severe)
    - Could you hang your clothes up in a wardrobe using the affected arm? (4 = Yes, easily … 0 = No, impossible)
    - Have you been able to wash and dry yourself under both arms? (4 = Yes, easily … 0 = No, impossible)
    - How much has pain from your shoulder interfered with your usual work? (4 = Not at all … 0 = Totally)
    - Have you been troubled by pain from your shoulder in bed at night? (4 = No nights … 0 = Every night)
    option_labels:
      4: 4 · No trouble / None (best)
      3: 3 · Very little / Mild
      2: 2 · Moderate
      1: 1 · Extreme difficulty / Severe
      0: 0 · Impossible / Unbearable (worst)
    aggregate: sum
    decimals: 0
    value_label: Oxford Shoulder Score (0–48, higher = better) · MCIC 6.50 (4.41–8.61); 8.42 predictive; "at least
      eight points" meaningful
