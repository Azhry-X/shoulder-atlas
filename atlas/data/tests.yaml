- id: quickdash
  type: info
  title: QuickDASH & DASH (Disabilities of the Arm, Shoulder and Hand)
  page: 4
  summary: 11-item upper-extremity disability scale (QuickDASH, scored 1–5 per item, requiring at least 10 items
    answered) and full DASH psychometrics.
  steps:
  - Patient rates 11 items from 1 (no difficulty / none) to 5 (unable / extreme); at least 10 of the 11 items must
    be answered.
  - Compute score = ((sum / n) − 1) × 25 on a 0–100 scale (0 = no disability, 100 = most severe disability).
  - Compare change against verified QuickDASH and DASH MDC90 and MCID thresholds.
  positive: 'Galardini 2024 (MA): DASH / QuickDASH pooled MCID 11.00 (8.59–13.41) / 11.97 (9.60–14.33); MDC90 9.04
    / 9.03. Franchignoni 2014: DASH / QuickDASH ICC 0.93 / 0.91; MDC90 10.81 / 12.85; MCID 10.83 / 15.91. Mintken
    2009: QuickDASH / NPRS test-retest 0.90 / 0.74; MCID 8.0 points / 1.1. Kelley 2013 (frozen shoulder): DASH MDC
    6.6–12.2 (weighted average 10.5); MCID 10.2.'
  interpretation: Highly reliable upper-limb functional measure with meta-analytic pooled MCID of 11.97 (QuickDASH)
    and 11.00 (DASH) (Galardini 2024).
  metrics: 'Galardini 2024 Phys Ther (MA, Level H): DASH / QuickDASH pooled MCID 11.00 (8.59–13.41) / 11.97 (9.60–14.33);
    MDC90 9.04 / 9.03. Franchignoni 2014 JOSPT (Level M): DASH / QuickDASH ICC 0.93 / 0.91; MDC90 10.81 / 12.85;
    MCID 10.83 / 15.91. Mintken 2009 J Shoulder Elbow Surg (Level M): QuickDASH / NPRS test-retest 0.90 / 0.74;
    MCID 8.0 points / 1.1. Kelley 2013 JOSPT CPG (Guideline, frozen shoulder): DASH MDC 6.6–12.2 (weighted average
    10.5); MCID 10.2.'
  evidence: H
  calculator:
    kind: formula
    inputs:
    - heading: QuickDASH 11 items (1 = no difficulty/none … 5 = unable/extreme; at least 10 items required)
    - key: i1
      label: 1. Open a tight or new jar
      type: select
      options: &id016
      - - 1
        - 1 · No difficulty
      - - 2
        - 2 · Mild difficulty
      - - 3
        - 3 · Moderate difficulty
      - - 4
        - 4 · Severe difficulty
      - - 5
        - 5 · Unable
      - - ''
        - — omit item (at least 10 of 11 required) —
    - key: i2
      label: 2. Do heavy household chores (e.g., wash walls, wash floors)
      type: select
      options: *id016
    - key: i3
      label: 3. Carry a shopping bag or briefcase
      type: select
      options: *id016
    - key: i4
      label: 4. Wash your back
      type: select
      options: *id016
    - key: i5
      label: 5. Use a knife to cut food
      type: select
      options: *id016
    - key: i6
      label: 6. Recreational activities in which you take some force or impact through your arm, shoulder or hand
      type: select
      options: *id016
    - key: i7
      label: 7. During the past week, to what extent has your arm, shoulder or hand problem interfered with your
        normal social activities?
      type: select
      options:
      - - 1
        - 1 · Not at all
      - - 2
        - 2 · Slightly
      - - 3
        - 3 · Moderately
      - - 4
        - 4 · Quite a bit
      - - 5
        - 5 · Extremely
      - - ''
        - — omit item (at least 10 of 11 required) —
    - key: i8
      label: 8. During the past week, were you limited in your work or other regular daily activities as a result
        of your arm, shoulder or hand problem?
      type: select
      options:
      - - 1
        - 1 · Not limited at all
      - - 2
        - 2 · Slightly limited
      - - 3
        - 3 · Moderately limited
      - - 4
        - 4 · Very limited
      - - 5
        - 5 · Unable
      - - ''
        - — omit item (at least 10 of 11 required) —
    - key: i9
      label: 9. Arm, shoulder or hand pain
      type: select
      options: &id017
      - - 1
        - 1 · None
      - - 2
        - 2 · Mild
      - - 3
        - 3 · Moderate
      - - 4
        - 4 · Severe
      - - 5
        - 5 · Extreme
      - - ''
        - — omit item (at least 10 of 11 required) —
    - key: i10
      label: 10. Tingling (pins and needles) in your arm, shoulder or hand
      type: select
      options: *id017
    - key: i11
      label: 11. During the past week, how much difficulty have you had sleeping because of the pain in your arm,
        shoulder or hand?
      type: select
      options:
      - - 1
        - 1 · No difficulty
      - - 2
        - 2 · Mild difficulty
      - - 3
        - 3 · Moderate difficulty
      - - 4
        - 4 · Severe difficulty
      - - 5
