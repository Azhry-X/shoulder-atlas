  positive: 'Dry needling: pain MD −0.49 (−0.84 to −0.13) — small, short term; disability MD −9.99 (−15.97 to −4.01)
    — low quality. Kinesio taping (14 studies): no better than sham for pain (MD −0.77, −1.77 to 0.22) or function.
    Cross-body stretch: +20.0° IR (SD 12.9) vs control +5.9° (P = .009); sleeper stretch +12.4° (not significant).'
  interpretation: Prefer the cross-body stretch over the sleeper stretch for asymptomatic/tight posterior shoulder
    internal rotation loss (+20.0° IR vs +5.9° control, P = .009); do not rely on kinesio taping (no better than
    sham).
  metrics: 'Navarro-Santana 2021 Phys Ther (MA, Level M): pain MD −0.49 (−0.84 to −0.13) — small, short term; disability
    MD −9.99 (−15.97 to −4.01) — low quality. Celik 2020 Clin Rehabil (MA, 14 studies, Level M): no better than
