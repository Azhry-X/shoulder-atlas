- id: yergasons-test
  type: test
  title: Yergason’s Resisted Supination Test (Biceps / SLAP)
  page: 4
  summary: Resisted forearm supination and external rotation with the elbow flexed to 90° at the side.
  steps:
  - Position the patient’s arm at the side with the elbow flexed to 90° and forearm pronated.
  - Resist active forearm supination (and external rotation) while palpating the long head of the biceps tendon
