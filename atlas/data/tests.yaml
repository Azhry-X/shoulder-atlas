  positive: HK + painful arc + infraspinatus test → 95% post-test probability of any impingement; painful arc +
    drop-arm + infraspinatus test → 91% for full-thickness tear.
  interpretation: Replacing Hawkins-Kennedy with the Drop-arm test shifts the cluster from general subacromial impingement
    (95%) to full-thickness rotator cuff tear (91%).
  metrics: 'Park 2005 JBJS Am: HK + painful arc + infraspinatus test → 95% post-test probability of any impingement;
