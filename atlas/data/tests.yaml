    baseline pain.
  - Place one hand over the superior aspect of the scapula and the other hand over the inferior angle.
  - Manually assist scapular upward rotation and posterior tilt as the patient repeats active arm elevation.
  positive: Substantial reduction in pain or increase in pain-free elevation range during manual scapular assistance
    — no verified numbers.
  interpretation: A positive SAT supports incorporating scapular upward-rotator and serratus anterior facilitation
