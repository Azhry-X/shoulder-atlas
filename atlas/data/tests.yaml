- id: spadi
  type: info
  title: Shoulder Pain and Disability Index (SPADI)
  page: 4
  summary: Condition-specific shoulder questionnaire consisting of 5 pain items and 8 disability items rated 0–10,
    expressed as a percentage disability score (0–100%).
  steps:
  - Patient rates 5 pain items (0 = no pain to 10 = worst pain imaginable) and 8 disability items (0 = no difficulty
    to 10 = so difficult it requires help).
  - Compute total percentage score (or subscale percentages) from the item sum scaled to 100%.
  - Compare longitudinal change against verified MDC90 and MCID thresholds.
  positive: MDC90 18.1; MCID 8.0 and 13.1 points (two studies — Kelley 2013).
  interpretation: Primary condition-specific outcome measure used in landmark trials including GRASP (Hopewell 2021)
    and SELF (Littlewood 2016).
