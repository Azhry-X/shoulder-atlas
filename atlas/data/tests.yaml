- id: murrell-cuff-tear-cluster
  type: test
  title: Murrell & Walton Rotator Cuff Tear Cluster
  page: 4
  summary: 3-item clinical cluster (supraspinatus weakness, external rotation weakness, and impingement sign) combined
    with patient age (≥ 60 years).
  steps:
  - Test for (1) supraspinatus weakness, (2) weakness in external rotation, and (3) a positive impingement sign.
  - Check whether all 3 signs are positive, OR whether any 2 signs are positive in a patient aged ≥ 60 years.
  positive: supraspinatus weakness + ER weakness + impingement sign all positive (or 2 positive and age ≥ 60) →
    98% chance of cuff tear.
  interpretation: When all 3 signs are positive (or 2 positive with age ≥ 60), post-test probability of a rotator
    cuff tear reaches 98%.
  metrics: 'Murrell & Walton 2001 Lancet: supraspinatus weakness + ER weakness + impingement sign all positive (or
    2 positive and age ≥ 60) → 98% chance of cuff tear.'
