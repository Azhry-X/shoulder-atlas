- id: ssmp
  type: test
  title: Shoulder Symptom Modification Procedure (SSMP)
  page: 3
  summary: Sequential clinical reasoning algorithm applying thoracic posture, scapular position, humeral head centring,
    and neuromodulatory modifications during a patient-nominated painful movement.
  steps:
  - Identify the patient-nominated provocative movement or functional task and establish baseline symptom intensity.
  - 'Apply sequential modifications: thoracic extension/posture adjustment, scapular position/assistance (SAT/SRT),
    and humeral head procedures (depression, AP/PA glide, or external rotation recruitment).'
  - Adopt any modification that meaningfully reduces symptoms directly into the patient’s active exercise prescription.
  positive: Meaningful immediate reduction or abolition of concordant pain during the provocative shoulder movement
    — no verified numbers.
  interpretation: Links physical examination directly to exercise selection without relying on pathoanatomical special
    test labels.
