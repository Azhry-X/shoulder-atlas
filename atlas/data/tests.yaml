- id: polymyalgia-rheumatica-eular-acr
  type: info
  title: Polymyalgia Rheumatica (PMR — EULAR/ACR 2012 Classification Criteria)
  page: 1
  summary: EULAR/ACR 2012 classification criteria for polymyalgia rheumatica in patients aged ≥ 50 years with bilateral
    aching shoulder pain and elevated inflammatory markers.
  steps:
  - Evaluate patients aged ≥ 50 years presenting with bilateral shoulder aching and abnormal CRP and/or ESR.
  - Score clinical criteria (morning stiffness, hip pain or limited range of motion, absence of RF/ACPA, absence
    of other joint involvement) and optional ultrasound criteria (bilateral subdeltoid bursitis / biceps tenosynovitis
    / glenohumeral synovitis, plus hip synovitis / trochanteric bursitis).
  - Apply the ≥ 4 cut-off (without ultrasound) or ≥ 5 cut-off (with ultrasound) and refer to rheumatology / primary
    care.
  positive: 'score ≥ 4 (no ultrasound): Sn 68%, Sp 78%; score ≥ 5 with ultrasound: Sn 66%, Sp 81%.'
  interpretation: Adding shoulder and hip ultrasound improves specificity (Sp 81% vs 78%) for classifying polymyalgia
    rheumatica.
  metrics: 'Dasgupta 2012 Ann Rheum Dis (EULAR/ACR 2012): score ≥ 4 (no ultrasound): Sn 68%, Sp 78%; score ≥ 5 with
    ultrasound: Sn 66%, Sp 81%.'
  evidence: M
  sources:
  - text: Dasgupta 2012 Ann Rheum Dis
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3298664/
    free_full_text: true
  review_status: approved
- id: cardiac-visceral-shoulder-referral
  type: info
  title: Cardiac, Diaphragmatic & Visceral Referred Shoulder Pain Screen
  page: 1
  summary: Clinical screening for myocardial ischaemia, pericarditis, diaphragmatic irritation, hepatobiliary disease,
    or splenic pathology referring pain to the shoulder complex.
  steps:
  - Screen for exertional, retrosternal, or left pectoral/shoulder/medial arm pain accompanied by dyspnoea, diaphoresis,
    nausea, or dizziness (cardiac ischaemia).
  - Screen for right scapular/shoulder pain associated with postprandial right upper quadrant pain, nausea, or jaundice
    (hepatobiliary / gallbladder referral via phrenic nerve).
  - Screen for left shoulder tip pain (Kehr sign) after abdominal/thoracic trauma, ectopic pregnancy, or diaphragmatic
    irritation; confirm that shoulder palpation and mechanical loading do not reproduce the primary symptom.
  positive: Non-mechanical shoulder pain provoked by exertion, respiration, or meals, or accompanied by autonomic/visceral
    signs — no verified numbers.
  interpretation: Visceral and cardiac referral must be excluded when shoulder symptoms are unrelated to glenohumeral
    or cervical movement.
  metrics: Clinical red-flag synthesis — no verified numbers in source file.
  evidence: E
  sources: []
  review_status: approved
- id: wainner-cervical-radiculopathy-cluster
  type: test
  title: Cervical Radiculopathy Screen — Wainner 4-Item Test Cluster
  page: 1
  summary: 4-item clinical examination cluster (Spurling test, cervical distraction test, ipsilateral cervical rotation
    < 60°, and Upper Limb Tension Test A) for ruling in or ruling out cervical radiculopathy.
  steps:
  - Perform Upper Limb Tension Test A (ULTT A — median nerve bias) as the primary high-sensitivity screening test
    to rule out cervical radiculopathy.
  - Measure active ipsilateral cervical rotation range of motion (< 60° threshold).
  - Perform the seated cervical distraction test (symptom reduction) and Spurling test (radicular symptom reproduction).
  - Count the number of positive tests across the 4-item cluster.
  positive: 4-item test cluster LR+ 30.3 (wide CI); ULTT A most useful to rule out.
  interpretation: When all 4 items are positive, LR+ rises to 30.3 (wide CI); a negative ULTT A is the most useful
    single test to rule out cervical radiculopathy.
  metrics: 'Wainner 2003 Spine: 4-item test cluster LR+ 30.3 (wide CI); ULTT A most useful to rule out.'
  evidence: M
  sources:
  - &id001
    text: Wainner 2003 Spine
    url: https://doi.org/10.1097/00007632-200301010-00014
    free_full_text: false
  review_status: approved
- id: ultt-a
  type: test
  title: Upper Limb Tension Test A (ULTT A — Median Nerve Bias)
  page: 1
  summary: Sequential upper-limb neurodynamic provocation test biasing the brachial plexus and median nerve roots
    (C5–C7) to screen cervical radiculopathy.
  steps:
  - Position the patient supine without a pillow; examiner depresses and stabilises the shoulder girdle.
  - Abduct the glenohumeral joint in the coronal plane, supinate the forearm, extend the wrist and fingers, externally
    rotate the shoulder, and slowly extend the elbow.
  - Perform structural differentiation using contralateral and ipsilateral cervical lateral flexion.
  positive: ULTT A most useful to rule out cervical radiculopathy; component of the Wainner 4-item test cluster
    (LR+ 30.3, wide CI).
  interpretation: Most sensitive upper-limb neurodynamic test for ruling out cervical radiculopathy during the shoulder
    clearing exam.
  metrics: 'Wainner 2003 Spine: 4-item test cluster LR+ 30.3 (wide CI); ULTT A most useful to rule out.'
  evidence: M
  video_url: https://www.youtube.com/watch?v=rir6x6Iiqc4
  video_title: Upper Limb Tension Test (ULTT) — All 4 Variants (Physiotutors)
  sources:
  - *id001
  review_status: approved
- id: rcrsp-subacromial-pain
  type: info
  title: Rotator Cuff-Related Shoulder Pain (RCRSP) & Subacromial Pain Syndrome
  page: 2
  summary: BESS/BOA definition, primary care epidemiology, rotator cuff tear prevalence, and RCRSP clinical framework.
  steps:
  - 'BESS/BOA clinical definition: "commonly located to the top and lateral side of the shoulder … exaggerated by
    overhead activity … can be associated with night pain … usually associated with full passive range of movement".'
  - 'Epidemiology: shoulder pain accounts for 2.4% of UK primary care consultations, with subacromial pain up to
    70% of shoulder-pain problems (Beard 2018 Lancet).'
  - 'Rotator cuff tear prevalence: "overall prevalence of rotator cuff tears is 34% and … risk increases significantly
    with age" (Kulkarni 2015).'
  - 'RCRSP terminology (Lewis 2016): umbrella term for subacromial pain, RC tendinopathy, partial and full-thickness
    tears; exercise ≈ surgery — no numbers.'
  positive: '"commonly located to the top and lateral side of the shoulder … exaggerated by overhead activity …
    can be associated with night pain … usually associated with full passive range of movement" (Kulkarni 2015).'
  interpretation: Preserved passive external rotation helps distinguish RCRSP/subacromial pain from frozen shoulder
    and glenohumeral osteoarthritis.
  metrics: 'Kulkarni 2015 (Guideline): "commonly located to the top and lateral side of the shoulder … exaggerated
    by overhead activity … can be associated with night pain … usually associated with full passive range of movement";
    "overall prevalence of rotator cuff tears is 34% and … risk increases significantly with age". Beard 2018 Lancet
    (CSAW, Level M): 2.4% of UK primary care consultations; subacromial pain up to 70% of shoulder-pain problems.
    Lewis 2016 Man Ther (Level E): umbrella term for subacromial pain, RC tendinopathy, partial and full-thickness
    tears; exercise ≈ surgery — no numbers.'
