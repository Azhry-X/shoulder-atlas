- id: subacromial-decompression-trials
  type: info
  title: Subacromial Decompression Landmark Trials (CSAW, FIMPACT & Ketola 12-Year)
  page: 5
  summary: Placebo-controlled and long-term randomised trials demonstrating that arthroscopic subacromial decompression
    (ASD) provides no clinically important benefit over diagnostic arthroscopy or structured exercise.
  steps:
  - 'CSAW trial (Beard 2018 Lancet, n = 313): OSS at 6 months: decompression 32.7 vs arthroscopy only 34.2, MD −1.3
    (−3.9 to 1.3); both surgical groups only a small benefit over no treatment (2.8 points vs decompression).'
  - 'FIMPACT trial at 24 months (Paavola 2018 BMJ): ASD vs diagnostic arthroscopy: pain VAS −4.6 (−11.3 to 2.1)
    at rest, −9.0 (−18.1 to 0.2) on activity — no clinically relevant difference.'
  - '12-year follow-up (Ketola 2017 Bone Joint J): no significant difference in pain between surgery and exercise.'
  - 'JOSPT/Quebec CPG 2022 (Lafrance 2022): "Subacromial decompression is not recommended to treat rotator cuff
    tendinopathy".'
  positive: 'CSAW (n = 313): OSS at 6 months decompression 32.7 vs arthroscopy only 34.2, MD −1.3 (−3.9 to 1.3);
    2.8 points vs no treatment. FIMPACT (24 months): pain VAS −4.6 (−11.3 to 2.1) at rest, −9.0 (−18.1 to 0.2) on
    activity — no clinically relevant difference. Ketola 2017 (12 years): no significant difference in pain between
    surgery and exercise.'
  interpretation: "Arthroscopic subacromial decompression gives no clinically important benefit over placebo arthroscopy (CSAW, FIMPACT) or exercise (Ketola, 12 years) for subacromial pain."
  metrics: 'Beard 2018 Lancet (CSAW, n = 313, Level H): OSS at 6 months: decompression 32.7 vs arthroscopy only
    34.2, MD −1.3 (−3.9 to 1.3); both surgical groups only a small benefit over no treatment (2.8 points vs decompression).
