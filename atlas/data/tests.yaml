- id: full-thickness-tear-exercise-vs-surgery
  type: info
  title: 'Full-Thickness Rotator Cuff Tears: Physiotherapy vs Surgery at 1 Year (Kukkonen) & 10 Years (Moosmayer)'
  page: 8
  summary: Randomised trials comparing physiotherapy with surgical repair for non-traumatic tears > 55 years at
    1 year (Kukkonen 2014, 180 shoulders) and small-to-medium tears at 10 years (Moosmayer 2019).
  steps:
  - 'Non-traumatic cuff tears > 55 years at 1 year (Kukkonen 2014, RCT, 180 shoulders): Constant at 1 year: physio
    74.1, acromioplasty 77.2, repair 77.9 (p = 0.34) — no significant difference at 1 year.'
  - 'Small/medium tears at 10 years (Moosmayer 2019 JBJS Am): primary tendon repair was better than physiotherapy
    by 9.6 Constant points (p = 0.002) and ASES 15.7; patients who crossed over to late surgery scored 10.0 points
    worse than primary repair.'
  - 'Reminder (Page 1 BESS/BOA): "An acute cuff tear as a result of a traumatic event needs urgent referral and
    ideally should be seen in the next available outpatient clinic."'
  positive: 'Kukkonen 2014 (180 shoulders, > 55 y): Constant at 1 year physio 74.1, acromioplasty 77.2, repair 77.9
    (p = 0.34). Moosmayer 2019 (10 years, small/medium tears): repair better than physio by 9.6 Constant points
    (p = 0.002), ASES 15.7; crossovers to late surgery 10.0 points worse than primary repair.'
  interpretation: In older adults (> 55 y) with atraumatic supraspinatus tears, structured physiotherapy is an effective
    first-line option at 1 year, but over a 10-year horizon in small/medium tears, primary surgical repair yields
    superior long-term function than physiotherapy or delayed crossover surgery.
  metrics: 'Kukkonen 2014 Bone Joint J (RCT, 180 shoulders, Level H): Constant at 1 year: physio 74.1, acromioplasty
    77.2, repair 77.9 (p = 0.34). Moosmayer 2019 JBJS Am (10 years, Level H): repair better than physio by 9.6 Constant
    points (p = 0.002), ASES 15.7; crossovers to late surgery 10.0 points worse than primary repair.'
  evidence: H
  sources:
