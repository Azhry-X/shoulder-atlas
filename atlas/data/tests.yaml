  - 'Peek 2015 J Man Manip Ther (SR, 3 RCTs): thoracic manual therapy reduced pain and disability vs usual care
    up to 52 weeks.'
  - 'Mintken 2010 Phys Ther (cervicothoracic manipulation CPR): ≥ 3 of 5 variables shifted short-term success from
    61% → 89% (LR+ 5.3), but note this comes from an unvalidated single-arm study.'
