  review_status: approved
- id: lift-off-test
  type: test
  title: Gerber Lift-Off Test (Subscapularis)
  page: 4
  summary: Active internal rotation lift-off of the dorsum of the hand away from the mid-lumbar spine.
  steps:
  - Place the dorsum of the patient’s hand against the mid-lumbar spine.
  - Instruct the patient to actively lift the hand posteriorly away from the back without extending the elbow or
    hyperextending the shoulder.
  - If passive internal rotation is restricted or painful, use the Bear-Hug or Belly-Press test instead.
  positive: lift-off Sn 17.6%, Sp 100% (Barth 2006); IRLS more sensitive than lift-off (Hertel 1996).
  interpretation: A positive lift-off test has 100% specificity in Barth 2006, but sensitivity is very low (17.6%)
    — pair with the Bear-Hug test (Sn 60%) and Internal Rotation Lag Sign.
  metrics: 'Barth 2006 Arthroscopy: bear-hug Sn 60%, Sp 91.7%; belly-press Sn 40%, Sp 97.9%; Napoleon Sn 25%, Sp
    97.9%; lift-off Sn 17.6%, Sp 100%. Hertel 1996 J Shoulder Elbow Surg: IRLS more sensitive than lift-off.'
  evidence: L
  sources:
  - *id010
  - *id009
  review_status: approved
- id: apprehension-test
  type: test
  title: Anterior Shoulder Apprehension Test
  page: 4
  summary: Passive 90° abduction and external rotation of the supine glenohumeral joint using apprehension (fear
    of imminent subluxation/dislocation), not isolated pain, as the positive criterion.
  steps:
  - Position the patient supine with the shoulder at the edge of the plinth, abducted to 90° and elbow flexed to
    90°.
  - Slowly externally rotate the humerus while observing the patient’s facial expression, protective muscular guarding,
    and verbal report.
  - Score positive only when true apprehension (sensation of imminent anterior instability) is elicited, rather
    than isolated posterior/subacromial pain.
  positive: apprehension Sn 72%, Sp 96%, LR 20.2 (apprehension as criterion, not pain — Farber 2006).
  interpretation: Using apprehension rather than pain as the positive criterion yields Sp 96% and LR 20.2; follow
    immediately with the Jobe Relocation and Surprise (Release) tests.
  metrics: 'Farber 2006 JBJS Am: apprehension Sn 72%, Sp 96%, LR 20.2; relocation Sn 81%, Sp 92%, LR 10.4 (apprehension
    as criterion, not pain); anterior drawer Sn 53%, Sp 85%, LR 3.6.'
  evidence: M
  video_url: https://www.youtube.com/watch?v=jZ29dAXKA5M
  video_title: Apprehension Test — Anterior Shoulder Instability (Physiotutors)
  sources:
  - &id011
    text: Farber 2006 JBJS Am
    url: https://doi.org/10.2106/JBJS.E.00594
    free_full_text: false
  review_status: approved
- id: relocation-test
  type: test
  title: Jobe Relocation Test
  page: 4
  summary: Application of a posteriorly directed force over the proximal humeral head in the 90°/90° apprehension
    position to relieve anterior apprehension.
  steps:
  - From the supine 90° abduction / external rotation position where apprehension was provoked, apply a firm anterior-to-posterior
    (AP) centring force over the anterior humeral head.
  - Assess whether the patient’s sense of apprehension disappears and further external rotation is tolerated.
  - Use apprehension relief (not pain relief alone) as the primary anterior instability criterion.
  positive: 'relocation Sn 81%, Sp 92%, LR 10.4 (apprehension as criterion, not pain — Farber 2006); SLAP (MA):
    best Sn relocation test 52% (Hegedus 2012).'
  interpretation: High accuracy for traumatic anterior instability when apprehension relief is used as the criterion
    (Sn 81%, Sp 92%, LR 10.4).
  metrics: 'Farber 2006 JBJS Am: relocation Sn 81%, Sp 92%, LR 10.4 (apprehension as criterion, not pain). Hegedus
    2012 BJSM: SLAP (MA): best Sn relocation test 52%.'
  evidence: M
  video_url: https://www.youtube.com/watch?v=YX1uJhjhwWg
  video_title: Relocation Test — Anterior Shoulder Instability (Physiotutors)
  sources:
  - *id011
  - *id004
  review_status: approved
- id: surprise-release-test
  type: test
  title: Surprise (Anterior Release) Test
  page: 4
  summary: Sudden removal of the posteriorly directed relocation force on the humeral head at 90° abduction and
    external rotation.
  steps:
  - Perform the Jobe Relocation test in supine 90° abduction and external rotation.
  - Carefully release the anterior-to-posterior stabilising hand from the humeral head while maintaining control
    of the forearm.
  - Note immediate return of anterior apprehension.
  positive: 'Sn 63.89%, Sp 98.91%; all three tests positive (apprehension + relocation + surprise): PPV 93.6%, NPV
    71.9% (Lo 2004).'
  interpretation: "Very high specificity (Sp 98.91%) in Lo 2004; when apprehension, relocation and surprise tests are all positive, PPV is 93.6%."
  cautions: Perform with caution to avoid provoking frank subluxation or dislocation in highly unstable shoulders.
  metrics: 'Lo 2004 Am J Sports Med: Sn 63.89%, Sp 98.91%; all three tests positive: PPV 93.6%, NPV 71.9%.'
  evidence: L
  sources:
  - text: Lo 2004 Am J Sports Med
    url: https://pubmed.ncbi.nlm.nih.gov/14977651/
    free_full_text: false
  review_status: approved
- id: load-and-shift-test
  type: test
  title: Load-and-Shift & Anterior Drawer Test
  page: 4
  summary: Passive assessment of anterior and posterior humeral head translation relative to the glenoid rim after
    centring ("loading") the humeral head.
  steps:
  - Stabilise the scapula and clavicle with one hand while grasping the humeral head with the other hand.
  - Apply a gentle axial compressive load to centre the humeral head in the glenoid fossa, then translate the humeral
    head anteriorly and posteriorly (or perform the supine anterior drawer test).
  - Compare translation magnitude, end-feel, and symptom reproduction against the contralateral shoulder.
  positive: anterior drawer Sn 53%, Sp 85%, LR 3.6 (Farber 2006).
  interpretation: "Grades translation; always distinguish asymptomatic physiological laxity from symptomatic instability and combine with apprehension, relocation and surprise tests."
  metrics: "No verified numbers for the load-and-shift test itself. Related anterior drawer test (Farber 2006 JBJS Am): Sn 53%, Sp 85%, LR 3.6."
  evidence: "E"
  video_url: https://www.youtube.com/watch?v=txARar71h5E
  video_title: Load and Shift Test — Shoulder Instability Assessment (Physiotutors)
  sources:
  - *id011
  review_status: approved
- id: sulcus-sign
  type: test
  title: Sulcus Sign (Inferior Glenohumeral Laxity)
  page: 4
  summary: Inferior longitudinal traction applied to the relaxed dependent humerus to assess inferior capsular laxity
    (rotator interval) and multidirectional instability.
  steps:
  - With the patient seated or standing and the arm relaxed at the side (0° abduction), stabilise the superior shoulder
    girdle.
  - Apply downward (caudal) traction at the distal humerus / elbow.
  - Observe for a visible/palpable subacromial sulcus step-off beneath the lateral acromial border and ask whether
    it reproduces the patient’s concordant instability symptoms.
  positive: Subacromial sulcus step-off accompanied by concordant inferior/multidirectional instability symptoms
    — no verified numbers.
  interpretation: An asymptomatic sulcus sign reflects generalized inferior laxity (Stanmore type II); clinical
    multidirectional instability requires symptom reproduction.
  metrics: no verified numbers — list the test only.
  evidence: E
  video_url: https://www.youtube.com/watch?v=vV7u2JtdYWI
  video_title: Sulcus Sign — Inferior Shoulder Instability Assessment (Physiotutors)
  sources: []
  review_status: approved
- id: cross-body-adduction-test
  type: test
  title: Cross-Body Adduction (Scarf) Test & AC Resisted Extension
  page: 4
  summary: Passive horizontal adduction of the 90° flexed arm across the chest (and resisted horizontal extension)
    to compress and provoke the acromioclavicular (AC) joint.
  steps:
  - Elevate the patient’s arm to 90° forward flexion and passively adduct the arm horizontally across the chest
    toward the contralateral shoulder.
  - Ask the patient to point with one finger to the exact site of pain (true AC joint pain is localized directly
    over the AC joint, not posteriorly).
  - Combine with AC resisted extension (Sn 72%) and Active Compression (O’Brien, Sp 95%).
  positive: cross-body adduction Sn 77%; AC resisted extension Sn 72%; active compression (O'Brien) Sn 41%, Sp 95%;
    all NPV > 94%, PPV < 30% (Chronopoulos 2004).
  interpretation: 'Cross-body adduction is the most sensitive of the three tests in Chronopoulos 2004 (Sn 77%, NPV
    > 94%) for ruling out AC joint pathology, while O’Brien is the most specific (Sp 95%). Note Hegedus 2008 BJSM:
    no impingement or AC-joint test showed significant diagnostic accuracy (2008 meta-analysis).'
  metrics: 'Chronopoulos 2004 Am J Sports Med (Level L): cross-body adduction Sn 77%; AC resisted extension Sn 72%;
    active compression (O''Brien) Sn 41%, Sp 95%; all NPV > 94%, PPV < 30%. Hegedus 2008 BJSM (Level M): no impingement
    or AC-joint test showed significant diagnostic accuracy (2008 meta-analysis).'
  evidence: L
  video_url: https://www.youtube.com/watch?v=DKLvt816x6o
  video_title: Cross-Body Adduction / Scarf Test — AC Joint Pathology (Physiotutors)
