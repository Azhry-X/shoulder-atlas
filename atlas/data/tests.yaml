- id: compression-rotation-test
  type: test
  title: Compression-Rotation & Passive Distraction Tests (SLAP)
  page: 4
  summary: Axial glenohumeral compression combined with internal/external rotation at 90° abduction to trap or provoke
    a superior labrum anterior-to-posterior (SLAP) tear.
  steps:
  - Position the patient supine with the shoulder abducted to 90° and elbow flexed to 90°.
  - Apply an axial compressive force along the humerus into the glenoid while rotating the humerus internally and
    externally (analogous to the knee McMurray maneuver).
  - Note reproduction of deep glenohumeral catching, clicking, or pain; optionally pair with the passive distraction
    test.
  positive: 'Hegedus 2012 (MA): best Sn relocation test 52%; best Sp Yergason 95%; best LR+ compression-rotation
    2.81; passive distraction test highly specific. Gismervik 2017 (MA): Compression-rotation test for SLAP DOR
    6.36 (1.41–28.59); Sp 0.89, Sn 0.43; SLAP tests overall pooled DOR of physical tests 1.38 (1.13–1.69) — poor.'
  interpretation: Among SLAP tests, Compression-Rotation showed the highest positive likelihood ratio in Hegedus
    2012 (LR+ 2.81) and DOR 6.36 (Sp 0.89, Sn 0.43) in Gismervik 2017, though overall SLAP physical test accuracy
    remains limited (pooled DOR 1.38).
  metrics: 'Hegedus 2012 BJSM: SLAP (MA): best Sn relocation test 52%; best Sp Yergason 95%; best LR+ compression-rotation
    2.81; passive distraction test highly specific. Gismervik 2017 BMC Musculoskelet Disord: Compression-rotation
    test for SLAP (MA): DOR 6.36 (1.41–28.59); Sp 0.89, Sn 0.43; SLAP tests overall pooled DOR of physical tests
    1.38 (1.13–1.69) — poor.'
  evidence: M
