- id: tos-calcific-differential
  type: info
  title: Calcific Tendinopathy & Thoracic Outlet Syndrome (TOS) Differential
  page: 2
  summary: Clinical differential features of resorptive/formative calcific tendinopathy and neurogenic or vascular
    thoracic outlet syndrome.
  steps:
  - 'Calcific tendinopathy: acute resorptive phase can cause severe, unremitting chemical pain mimicking joint sepsis
    or acute gout, while formative/resting phase mimics subacromial pain; confirm calcific deposit on radiograph
    or ultrasound.'
  - 'Thoracic outlet syndrome (TOS): evaluate for positional upper-limb paraesthesia, heaviness, fatigue, or vascular
    colour/temperature changes during overhead work.'
  - Combine cervical radiculopathy screening (Wainner cluster / ULTT A) and peripheral neurological examination
    to differentiate TOS from cervical root compression.
  positive: Clinical pattern recognition in words — no verified numbers in source file.
  interpretation: For calcific tendinopathy management evidence (ESWT and ultrasound-guided barbotage RCT), see
    Page 6.
  metrics: Clinical differential synthesis — no verified numbers in source file.
  evidence: E
  sources: []
  review_status: approved
- id: shoulder-rom-kolber
  type: test
  title: Shoulder Range of Motion Assessment — Goniometer vs Digital Inclinometer (Kolber)
  page: 3
  summary: Active and passive shoulder goniometry / inclinometry across flexion, abduction, external rotation at
    0° and 90° abduction, internal rotation at 90°, and total rotational motion arc.
  steps:
  - Measure active and passive flexion, abduction, external rotation (ER) at 0° adduction and at 90° abduction,
    and internal rotation (IR) at 90° abduction with scapular stabilisation.
  - Compute Total Rotational Motion (TRM = ER at 90° + IR at 90°) and compare against the contralateral side (see
    Wilk thrower criteria on Page 8).
  - 'Do not swap between universal goniometer and digital inclinometer across visits: limits of agreement are 2°–20°
    (Kolber 2012).'
  positive: intrarater ICC ≥ 0.94 (goniometer), ≥ 0.95 (inclinometer); limits of agreement 2°–20° → do not swap
    instruments between visits.
  interpretation: Both goniometry and digital inclinometry have high intrarater reliability, but wide inter-instrument
    limits of agreement (2°–20°) mean the same instrument must be used for serial reassessment.
  metrics: 'Kolber 2012 IJSPT: intrarater ICC ≥ 0.94 (goniometer), ≥ 0.95 (inclinometer); limits of agreement 2°–20°
    → do not swap instruments between visits.'
  evidence: M
  sources:
  - text: Kolber 2012 IJSPT
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3362980/
    free_full_text: true
  review_status: approved
- id: scapular-dyskinesis-test
  type: test
  title: Scapular Dyskinesis Test (SDT — McClure & Singh)
  page: 3
  summary: Visual dynamic observation of scapulothoracic motion during weighted bilateral shoulder flexion and coronal-plane
    abduction.
  steps:
  - Instruct the patient to perform 5 repetitions of bilateral active weighted shoulder flexion and 5 repetitions
    of bilateral weighted abduction holding 1.4 kg or 2.3 kg dumbbells.
  - Observe the medial border and inferior angle of the scapula from posteriorly for dysrhythmia (premature/excessive
    elevation, shrugging, or rapid downward rotation) or winging.
  - Classify each shoulder as normal, subtle abnormality, or obvious dyskinesis.
  positive: '5 reps weighted flexion + abduction (1.4 kg or 2.3 kg); agreement 75–82%, κw 0.48–0.61 (McClure 2009).
    In rugby players: slight reliability (κ 0.16; 41%) (Singh 2021).'
  interpretation: Moderate inter-rater reliability in general overhead populations (McClure 2009), but only slight
    reliability in rugby players (Singh 2021) — pair visual observation with symptom modification tests (SAT, SRT,
    SSMP).
  metrics: 'McClure 2009 J Athl Train (Level M): 5 reps weighted flexion + abduction (1.4 kg or 2.3 kg); agreement
    75–82%, κw 0.48–0.61. Singh 2021 S Afr J Sports Med (Level L, rugby players): slight reliability (κ 0.16; 41%).'
  evidence: M
