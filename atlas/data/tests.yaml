- id: ases
  type: info
  title: American Shoulder and Elbow Surgeons Standardized Shoulder Assessment Form (ASES)
  page: 4
  summary: 100-point shoulder outcome score combining pain (0–10 numeric/VAS weighted 50%) and 10 daily functional
    activities (0–3 scale weighted 50%, higher = better).
  steps:
  - Record patient pain today on a 0–10 scale; compute pain component = (10 − pain) × 5 (maximum 50 points).
  - Rate 10 daily activities from 0 (unable to do) to 3 (not difficult); compute function component = function sum
    × 5 / 3 (maximum 50 points).
  - Sum the two components for the total ASES score (0–100, where 100 = best function / no pain).
  positive: ICC 0.84; MDC 9.7; MCID 6.4 points (Michener 2002).
  interpretation: An increase of ≥ 6.4 points exceeds the MCID and ≥ 9.7 points exceeds the MDC (Michener 2002).
  metrics: 'Michener 2002 J Shoulder Elbow Surg: ICC 0.84; MDC 9.7; MCID 6.4 points.'
  evidence: M
  calculator:
    kind: formula
    inputs:
    - heading: 'Pain subscale (50 points: (10 − pain) × 5)'
