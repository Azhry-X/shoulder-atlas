- id: shoulder-tracking-flowsheet
  type: info
  title: Longitudinal Shoulder Outcome Tracking & Verified MCID / MDC / PASS Thresholds
  page: 9
  summary: Session-by-session tracking and discharge milestone criteria comparing baseline and follow-up shoulder
    PROMs and objective tests against verified psychometric thresholds.
  steps:
  - Record session NPRS, passive/active ER and elevation ROM, scapular/cuff symptom modification, exercise loading,
    and manual therapy adjuncts across 12 visits.
  - Re-administer baseline shoulder PROMs (SPADI, QuickDASH, DASH, ASES, Constant, Oxford Shoulder Score, WOSI,
    NPRS, PSFS) and compare change against verified MCID and MDC values.
  - Verify objective functional milestones (e.g. CKCUEST improvement of at least 3 touches, Tucci 2014; Constant
    PASS 80 or SST PASS 11 after subacromial surgery, Kanto 2021).
  positive: 'SPADI: MDC90 18.1; MCID 8.0 and 13.1 points (two studies, Kelley 2013). QuickDASH / DASH (MA, Galardini
    2024): pooled MCID 11.00 (8.59–13.41) / 11.97 (9.60–14.33); MDC90 9.04 / 9.03. QuickDASH / NPRS (Mintken 2009):
    MCID 8.0 points / 1.1. ASES (Michener 2002): ICC 0.84; MDC 9.7; MCID 6.4 points. Constant (Kukkonen 2013): MCID
    10.4 points; Kanto 2021 MID: pain on activity 20 mm, Constant 10 points, SST 1.5; PASS: Constant 80, SST 11.
    Oxford Shoulder Score (Fang 2024): MCIC 6.50 (4.41–8.61) mean-change; 8.42 predictive; "at least eight points"
    meaningful.'
  interpretation: Combine validated PROM change scores with objective ROM (using the same instrument across visits,
    Kolber 2012), strength, and sport-specific readiness for discharge decision-making.
  metrics: 'Kelley 2013 JOSPT CPG (SPADI): MDC90 18.1; MCID 8.0 and 13.1 points (two studies); DASH (frozen shoulder):
    MDC 6.6–12.2 (weighted average 10.5), MCID 10.2. Galardini 2024 Phys Ther (DASH / QuickDASH MA): pooled MCID
    11.00 (8.59–13.41) / 11.97 (9.60–14.33); MDC90 9.04 / 9.03. Franchignoni 2014 JOSPT (DASH / QuickDASH): ICC
    0.93 / 0.91; MDC90 10.81 / 12.85; MCID 10.83 / 15.91. Mintken 2009 J Shoulder Elbow Surg (QuickDASH / NPRS):
