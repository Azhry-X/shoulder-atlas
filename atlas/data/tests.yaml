- id: neer-test
  type: test
  title: Neer Passive Forward Elevation Impingement Sign
  page: 4
  summary: Passive maximal forward elevation of the internally rotated humerus while stabilising the scapula to
    provoke subacromial pain.
  steps:
  - Stand beside the seated or standing patient and stabilise the scapula superiorly to prevent scapular elevation.
  - Passively internally rotate the patient’s arm and elevate it maximally in the sagittal/scapular plane.
  - Interpret as part of the 5-item Michener subacromial cluster rather than in isolation.
  positive: Neer Sn 72%, Sp 60% (Hegedus 2012); Neer LR− 0.35 (0.12–0.97), κ 0.39–0.40 (Michener 2009).
  interpretation: Low specificity (Sp 60%) limits standalone diagnostic value; combine with Hawkins-Kennedy, painful
    arc, empty can, and ER resistance in the Michener ≥ 3/5 cluster.
  metrics: 'Hegedus 2012 BJSM (MA): Neer Sn 72%, Sp 60%. Michener 2009 Arch Phys Med Rehabil: Neer LR− 0.35 (0.12–0.97);
    κ 0.39–0.40 (Neer, HK).'
