- id: hhd-shoulder-strength
  type: test
  title: Hand-Held Dynamometry (HHD) & Isometric Shoulder Strength Testing
  page: 3
  summary: Objective isometric force measurement of external rotation, internal rotation, scaption/abduction, and
    periscapular muscle groups using a hand-held dynamometer.
  steps:
  - Standardise patient position (seated, supine, or prone), arm angle (neutral 0° or 90° abduction), and dynamometer
    placement (distal forearm proximal to ulnar styloid).
  - Perform make tests (or belt-stabilised isometric holds) bilaterally for ER, IR, abduction/scaption, flexion,
    and extension.
  - Record raw values and compute within-patient limb symmetry and ER:IR ratios across visits (no normative cut-offs
    applied).
  positive: Asymmetric isometric force deficit or symptom reproduction compared with the uninvolved limb and serial
    baseline — no verified numbers.
  interpretation: Track individual strength recovery and ER:IR balance across rehabilitation phases.
  metrics: no verified numbers — list the test only.
