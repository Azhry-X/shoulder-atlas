- id: upper-limb-neuro-screen
  type: test
  title: Upper-Limb Neurological Examination Grid (C5–T1)
  page: 3
  summary: Systematic root-level neurological examination of C5–T1 dermatomes, myotomes, and deep tendon reflexes,
    plus axillary, suprascapular, and long thoracic peripheral nerve screening.
  steps:
  - 'Sensory (dermatomes): test light touch and pinprick across C5 (lateral deltoid / regimental badge area), C6
    (lateral forearm, thumb & index finger), C7 (middle finger), C8 (ring & little fingers / ulnar border of hand),
    and T1 (medial forearm).'
  - 'Motor (myotomes): test isometric strength across C5 (shoulder abduction & ER — deltoid/infraspinatus), C6 (elbow
    flexion & wrist extension — biceps/ECRL), C7 (elbow extension & wrist flexion — triceps/FCR), C8 (thumb extension
    & finger flexion — EPL/FDP), and T1 (finger abduction/adduction — dorsal/palmar interossei).'
  - 'Reflexes: grade Biceps (C5–C6), Brachioradialis (C6), and Triceps (C7) deep tendon reflexes, and screen Hoffman
    / Babinski signs if cervical myelopathy is suspected.'
  positive: Dermatomal sensory loss, myotomal weakness, or diminished/absent deep tendon reflex concordant with
    a cervical root or peripheral nerve injury — no verified numbers.
  interpretation: "Always check the axillary nerve (regimental badge sensation + deltoid contraction) after traumatic dislocation: clinically apparent nerve injury ≈ 13.5% of dislocations, nerve injury on EMG 48% (Brownson 2015)."
  metrics: Standard neurological examination grid — no verified numbers in source file.
  evidence: E
