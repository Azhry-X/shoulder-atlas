- id: scapular-assistance-test
  type: test
  title: Scapular Assistance Test (SAT)
  page: 3
  summary: Symptom modification maneuver assessing whether manual assistance of scapular upward rotation and posterior
    tilt reduces pain during active shoulder elevation.
  steps:
