- id: michener-saps-cluster
  type: test
  title: Michener Subacromial Pain / Impingement Cluster (≥ 3 of 5 Tests)
  page: 4
  summary: 5-test diagnostic cluster (Neer, Hawkins-Kennedy, painful arc, empty can, and external rotation resistance)
