- id: scapular-retraction-test
  type: test
  title: Scapular Retraction Test (SRT)
  page: 3
  summary: Manual stabilisation of the scapula in retraction/posterior tilt during supraspinatus testing or elevation
    to evaluate symptom modification and apparent cuff strength.
  steps:
  - Perform a baseline Empty Can (Jobe) or elevation provocation test and note pain and isometric strength.
  - Stabilise the medial border and clavicle/spine of the scapula manually in a gently retracted, posteriorly tilted
    position against the thorax.
  - Repeat the isometric test or elevation maneuver and compare pain intensity and force output.
  positive: Reduction of shoulder pain or improvement in apparent supraspinatus isometric strength with manual scapular
    retraction — no verified numbers.
