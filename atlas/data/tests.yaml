    free_full_text: false
  review_status: approved
- id: biceps-load-ii-test
  type: test
  title: Biceps Load Test II (SLAP Lesion)
  page: 4
  summary: Resisted elbow flexion in the supine abducted and externally rotated position to tension the long head
    of the biceps-superior labrum anchor.
  steps:
  - Position the patient supine with the shoulder abducted, elbow flexed to 90°, and forearm supinated.
  - Externally rotate the shoulder to the point of apprehension or end-range.
  - Ask the patient to actively flex the elbow against your resistance while maintaining the supinated, externally
    rotated position.
  positive: Sn 89.7%, Sp 96.9%, κ 0.815 (single-surgeon study — Kim 2001).
  interpretation: Reported high accuracy in its original single-surgeon derivation study (Kim 2001), but interpret
    with caution as pooled SLAP physical test accuracy across meta-analyses is poor (pooled DOR 1.38, 1.13–1.69,
    Gismervik 2017).
  metrics: 'Kim 2001 Arthroscopy (Level L): Sn 89.7%, Sp 96.9%, κ 0.815 (single-surgeon study). Gismervik 2017 BMC
    Musculoskelet Disord (Level M): SLAP tests overall pooled DOR of physical tests 1.38 (1.13–1.69) — poor.'
  evidence: L
