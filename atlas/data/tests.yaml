- id: mdi-watson-programme
  type: info
  title: 'Multidirectional Instability (MDI): Watson vs Rockwood Rehabilitation Programme (Warby)'
  page: 8
  summary: Randomised controlled trial comparing the Watson scapular motor-control and progressive arc-loading programme
    against the Rockwood general strengthening programme in multidirectional shoulder instability.
  steps:
  - Re-establish optimal scapular upward rotation and posterior tilt control before loading into glenohumeral elevation
    or external rotation.
  - Progress rotator cuff and deltoid loading across increasing elevation arcs while maintaining dynamic scapular
    and humeral head control (Watson programme).
  - Track progress with the Western Ontario Shoulder Instability Index (WOSI).
  positive: WOSI effect 11.1 (1.9–20.2) at 12 weeks; 12.6 (3.4–21.9) at 24 weeks — favours Watson (Warby 2018).
  interpretation: The Watson scapular-specific motor-control programme outperforms the Rockwood programme on the
    WOSI at both 12 and 24 weeks in patients with MDI.
  metrics: 'Warby 2018 Am J Sports Med: WOSI effect 11.1 (1.9–20.2) at 12 weeks; 12.6 (3.4–21.9) at 24 weeks — favours
    Watson.'
  evidence: M
  sources:
  - text: Warby 2018 Am J Sports Med
    url: https://doi.org/10.1177/0363546517734508
    free_full_text: false
  review_status: approved
- id: throwers-gird-trm-wilk
  type: info
  title: 'Overhead Throwers: GIRD, Total Rotational Motion Deficit & External Rotation Gain (Wilk 2011 & 2015)'
  page: 8
  summary: Prospective cohort studies in professional baseball pitchers evaluating glenohumeral internal rotation
    deficit (GIRD), total rotational motion (TRM) deficit, and external rotation (ER) gain.
  steps:
  - Measure passive ER and IR at 90° abduction bilaterally and compute Total Rotational Motion (TRM = ER + IR).
  - 'Wilk 2011: GIRD had ≈ twice the injury rate but was not statistically significant (P = .17), whereas a total
    rotational motion deficit > 5° was associated with a higher injury rate.'
  - 'Wilk 2015: insufficient ER (< 5° more ER on the throwing side compared with the non-throwing side) carried
    2.2× disabled-list risk (1.2–4.1) and 4.0× surgery risk (1.5–12.6); GIRD was not significant.'
  positive: 'Wilk 2011: GIRD ≈ twice the injury rate but not significant (P = .17); total rotational motion deficit
    > 5° → higher injury rate. Wilk 2015: insufficient ER (< 5° more ER on throwing side): 2.2× disabled-list risk
    (1.2–4.1), 4.0× surgery (1.5–12.6); GIRD not significant.'
  interpretation: Evaluate Total Rotational Motion deficit (> 5° deficit vs non-throwing side) and throwing-side
    ER gain (< 5° more ER) rather than GIRD in isolation when screening overhead throwers.
  metrics: 'Wilk 2011 Am J Sports Med: GIRD ≈ twice the injury rate but not significant (P = .17); total rotational
    motion deficit > 5° → higher injury rate. Wilk 2015 Am J Sports Med: insufficient ER (< 5° more ER on throwing
    side): 2.2× disabled-list risk (1.2–4.1), 4.0× surgery (1.5–12.6); GIRD not significant.'
  evidence: L
  sources:
  - text: Wilk 2011 Am J Sports Med
    url: https://doi.org/10.1177/0363546510384223
    free_full_text: false
  - text: Wilk 2015 Am J Sports Med
    url: https://doi.org/10.1177/0363546515594380
    free_full_text: false
