    expr: '([i1,i2,i3,i4,i5,i6,i7,i8,i9,i10,i11].filter(Number.isFinite).length>=10 ? (([i1,i2,i3,i4,i5,i6,i7,i8,i9,i10,i11].filter(Number.isFinite).reduce((a,b)=>a+b,0)/[i1,i2,i3,i4,i5,i6,i7,i8,i9,i10,i11].filter(Number.isFinite).length)-1)*25
