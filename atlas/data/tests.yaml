- id: rotator-cuff-exercise-trials
  type: info
  title: 'Rotator Cuff Exercise Trials: GRASP, Holmgren, SELF, Load, Pain Allowance & Scapular Focus'
  page: 8
  summary: Synthesis of landmark exercise trials and meta-analyses for rotator cuff disorders (Hopewell 2021 GRASP,
    Holmgren 2012, Littlewood 2016 SELF, Ingwersen 2017, Smith 2017, Saito 2018).
  steps:
  - 'GRASP trial (Hopewell 2021 Lancet, n = 708): progressive exercise vs one best-practice advice session: SPADI
    over 12 months −0.66 (99% CI −4.52 to 3.20) — no difference; injection vs no injection −1.11 (−4.47 to 2.26).'
  - 'Specific cuff & scapular exercise vs control exercise in surgical-waitlist patients (Holmgren 2012 BMJ): Constant-Murley
    +24 vs +9 points (MD 15, 8.5–20.6); surgery chosen by 20% vs 63% (OR 7.7, 3.1–19.4).'
  - 'Single self-managed loaded exercise vs usual physiotherapy (SELF — Littlewood 2016): SPADI at 3 months 32.4
    vs 30.7 usual physio; adjusted MD 3.2 (−6.0 to 12.4) — comparable.'
  - 'Heavy vs low load (Ingwersen 2017, n = 100): DASH adjusted difference −1.37 (−6.72 to 3.99) — no superiority
    of high-load.'
  - 'Painful vs pain-free exercise (Smith 2017 BJSM MA): short-term pain SMD −0.27 (−0.54 to −0.05) in favour of
    painful exercise; no difference later.'
  - 'Scapular-focused exercise (Saito 2018 MA, 6 RCTs): short-term pain MD −0.88 (−1.19 to −0.58), function −11.31
    (−17.20 to −5.41); no difference at follow-up.'
  positive: 'GRASP (n = 708): SPADI over 12 months −0.66 (99% CI −4.52 to 3.20) — no difference; injection −1.11
    (−4.47 to 2.26). Holmgren 2012: Constant-Murley +24 vs +9 (MD 15, 8.5–20.6); surgery chosen by 20% vs 63% (OR
    7.7, 3.1–19.4). SELF: SPADI at 3 months 32.4 vs 30.7; adjusted MD 3.2 (−6.0 to 12.4). Ingwersen (n = 100): DASH
    −1.37 (−6.72 to 3.99). Smith 2017: short-term pain SMD −0.27 (−0.54 to −0.05) favouring painful exercise. Saito
    2018 (6 RCTs): short-term pain MD −0.88 (−1.19 to −0.58), function −11.31 (−17.20 to −5.41).'
  interpretation: A single well-delivered best-practice advice/self-managed exercise programme (GRASP, SELF) achieves
    outcomes comparable to multi-session physiotherapy; specific exercise markedly reduces need for subacromial
    surgery (20% vs 63%, Holmgren 2012), and exercising into tolerable pain is safe and effective short term (Smith
    2017).
  metrics: 'Hopewell 2021 Lancet (GRASP, n = 708, Level H): progressive exercise vs one best-practice advice session:
    SPADI over 12 months −0.66 (99% CI −4.52 to 3.20) — no difference; injection vs no injection −1.11 (−4.47 to
    2.26). Holmgren 2012 BMJ (Level H): Constant-Murley +24 vs +9 points (MD 15, 8.5–20.6); surgery chosen by 20%
    vs 63% (OR 7.7, 3.1–19.4). Littlewood 2016 Clin Rehabil (SELF, Level M): SPADI at 3 months 32.4 vs 30.7 usual
    physio; adjusted MD 3.2 (−6.0 to 12.4) — comparable. Ingwersen 2017 Orthop J Sports Med (RCT, n = 100, Level
    M): DASH adjusted difference −1.37 (−6.72 to 3.99) — no superiority of high-load. Smith 2017 BJSM (MA, Level
    M): short-term pain SMD −0.27 (−0.54 to −0.05) in favour of painful exercise; no difference later. Saito 2018
    Physiother Theory Pract (MA, 6 RCTs, Level M): short-term pain MD −0.88 (−1.19 to −0.58), function −11.31 (−17.20
    to −5.41); no difference at follow-up.'
