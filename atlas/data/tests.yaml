- id: corticosteroid-injections-hydrodilatation
  type: info
  title: Corticosteroid Injections, Hydrodilatation & CPG Recommendations (Cuff & Frozen Shoulder)
  page: 6
  summary: Evidence synthesis for subacromial corticosteroid injection in rotator cuff tendinosis (Mohamadi 2017,
    Lafrance 2022) and intra-articular injection / arthrographic distension in frozen shoulder (Challoumas 2020,
    Carette 2003, Kelley 2013, Buchbinder 2008).
  steps:
  - 'Rotator cuff tendinosis (Mohamadi 2017 MA): no better than placebo at 3 months; small transient relief at 4–8
    weeks (SMD 0.52); at least 5 treated for 1 to benefit.'
  - 'JOSPT/Quebec CPG 2022 (Lafrance 2022): "Clinicians should prescribe an active and task-oriented rehabilitation
    program (exercises and education)"; "Subacromial decompression is not recommended to treat rotator cuff tendinopathy";
    injections "may be useful to reduce pain in the short term".'
  - 'Frozen shoulder NMA (Challoumas 2020, 65 studies): only intra-articular corticosteroid clinically superior
    short term: pain vs placebo MD −1.0 (−1.5 to −0.5), vs physio −1.1 (−1.7 to −0.5) VAS.'
  - 'Frozen shoulder injection ± physio RCT (Carette 2003): injection + home exercise effective; adding supervised
    physio gives faster ROM gain; physio alone of limited efficacy; all groups similar at 12 months.'
  - 'JOSPT CPG (Kelley 2013): "Intra-articular corticosteroid injections combined with shoulder mobility and stretching
    exercises are more effective in providing short-term (4-6 weeks) pain relief and improved function compared
    to shoulder mobility and stretching exercises alone." (strong evidence).'
  - 'Hydrodilatation / arthrographic distension (Buchbinder 2008 Cochrane): 1 low-risk-of-bias trial: distension
    with saline + steroid better than placebo at 3 weeks (NNTB 2 pain, 3 function).'
  positive: 'Cuff tendinosis: SMD 0.52 at 4–8 weeks, no better than placebo at 3 months, NNT ≥ 5 (Mohamadi 2017).
    Frozen shoulder NMA: intra-articular steroid vs placebo MD −1.0 (−1.5 to −0.5), vs physio −1.1 (−1.7 to −0.5)
    VAS (Challoumas 2020). Hydrodilatation at 3 weeks: NNTB 2 pain, 3 function (Buchbinder 2008).'
  interpretation: 'Remember surgical infection caution (Page 5): injection within 1 month before arthroscopic cuff
    repair increases infection risk (1.3% vs 0.8%, OR 1.7, 1.0–2.9, Forsythe 2019).'
  metrics: 'Mohamadi 2017 Clin Orthop Relat Res (MA, Level M): no better than placebo at 3 months; small transient
    relief at 4–8 weeks (SMD 0.52); at least 5 treated for 1 to benefit. Challoumas 2020 JAMA Netw Open (NMA, 65
    studies, Level M): only intra-articular corticosteroid clinically superior short term: pain vs placebo MD −1.0
    (−1.5 to −0.5), vs physio −1.1 (−1.7 to −0.5) VAS. Carette 2003 Arthritis Rheum (RCT, Level M): injection +
    home exercise effective; adding supervised physio gives faster ROM gain; physio alone of limited efficacy; all
    groups similar at 12 months. Kelley 2013 JOSPT CPG (Guideline): "Intra-articular corticosteroid injections combined
    with shoulder mobility and stretching exercises are more effective in providing short-term (4-6 weeks) pain
    relief and improved function compared to shoulder mobility and stretching exercises alone." (strong evidence).
    Buchbinder 2008 Cochrane (Level L): 1 low-risk-of-bias trial: distension with saline + steroid better than placebo
    at 3 weeks (NNTB 2 pain, 3 function). Lafrance 2022 JOSPT (Guideline): "Clinicians should prescribe an active
    and task-oriented rehabilitation program (exercises and education)"; "Subacromial decompression is not recommended
    to treat rotator cuff tendinopathy"; injections "may be useful to reduce pain in the short term".'
  evidence: M
