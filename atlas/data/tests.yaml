- id: septic-arthritis-shoulder
  type: info
  title: Septic Arthritis — Synovial Fluid WBC Thresholds
  page: 1
  summary: Diagnostic accuracy of synovial fluid white blood cell (WBC) count thresholds for acute native-joint
    septic arthritis.
  steps:
  - Screen for acute hot, swollen, severely painful shoulder with marked global restriction of active and passive
    motion.
  - '"A suspected infected joint needs same day emergency referral."'
  - Evaluate synovial fluid aspiration white blood cell (WBC) count likelihood ratios alongside Gram stain and culture.
  positive: 'WBC > 25,000/µL: LR 2.9 (2.5–3.4); > 50,000/µL: LR 7.7 (5.7–11.0).'
  interpretation: Synovial WBC > 50,000/µL substantially increases the likelihood of septic arthritis (LR 7.7, 5.7–11.0).
  metrics: 'Margaretten 2007 JAMA: WBC > 25,000/µL: LR 2.9 (2.5–3.4); > 50,000/µL: LR 7.7 (5.7–11.0).'
  evidence: M
  sources:
