- id: cuff-repair-early-vs-delayed-prom
  type: info
  title: 'Rotator Cuff Repair: Early vs Delayed Passive ROM (Kluczynski) & Pre-Op Injection Risk (Forsythe)'
  page: 5
  summary: Meta-analysis of early vs delayed passive range of motion after rotator cuff repair stratified by tear
    size (28 studies, 1,729 repairs) and infection risk from corticosteroid injection within 1 month before repair.
  steps:
  - POST-OP RESTRICTIONS ARE SURGEON-DIRECTED — verify tear size, repair construct, and surgeon-directed passive/active
    motion instructions.
  - 'Level 1 studies overall: retear 13.7% early vs 10.5% delayed, RR 1.30 (0.74–2.30), P = .36.'
  - 'Stratify by tear size (Kluczynski 2015): tears ≤ 3 cm (TO + single-row): 18.7% vs 28.2%, RR 0.66 (0.47–0.95);
    tears > 5 cm (double-row): 56.4% vs 20%, RR 2.82 (1.31–6.07) → tear size matters.'
  - 'Pre-operative injection timing (Forsythe 2019): injection within 1 month before arthroscopic cuff repair is
