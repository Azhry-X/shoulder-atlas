- id: ckcuest
  type: test
  title: Closed Kinetic Chain Upper Extremity Stability Test (CKCUEST)
  page: 3
  summary: Timed closed-kinetic-chain upper-limb plyometric/stability test counting alternating cross-body hand
    touches from a push-up position (or modified kneeling push-up).
  steps:
  - Place two strips of tape on the floor in parallel; patient assumes a standard push-up position (or modified
    kneeling push-up for females/early rehab) with hands on the tape.
  - Instruct the patient to alternately reach across and touch the opposite hand/tape line as fast as possible during
    each timed trial.
  - Average the number of touches across test trials and compare change against the MDC threshold.
  positive: MDC 2.05–3.91 touches; at least 3 touches = real improvement.
  interpretation: An increase of at least 3 touches between sessions represents real clinical improvement beyond
    measurement error.
  metrics: 'Tucci 2014 BMC Musculoskelet Disord: MDC 2.05–3.91 touches; at least 3 touches = real improvement.'
  evidence: M
  sources:
  - text: Tucci 2014 BMC Musculoskelet Disord
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3890535/
    free_full_text: true
  review_status: approved
- id: ybt-uq
  type: test
  title: Upper Quarter Y-Balance Test (YBT-UQ)
  page: 3
  summary: Closed-kinetic-chain upper-extremity reach test in the medial, inferolateral, and superolateral directions
    while stabilising on the stance arm in a push-up plank.
  steps:
  - Measure upper-limb length from the C7 spinous process to the tip of the middle finger with the shoulder abducted
    to 90°.
  - From a push-up position, the patient stabilises on the tested arm and reaches maximally with the free hand along
    the medial, inferolateral, and superolateral directions without losing 3-point contact.
  - Record reach distances and compare limb symmetry against the patient’s own baseline (no normative cut-offs applied).
  positive: Side-to-side reach asymmetry or apprehension during closed-chain weight-bearing — no verified numbers.
  interpretation: Used alongside CKCUEST to evaluate closed-chain shoulder stability for return to sport.
  metrics: no verified numbers — list the test only.
