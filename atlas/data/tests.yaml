- id: pancoast-tumour
  type: info
  title: Pancoast (Superior Sulcus) Apical Lung Tumour Triage
  page: 1
  summary: Oncological red-flag screening for apical bronchogenic carcinoma masquerading as musculoskeletal shoulder
    or C8–T1 radicular pain.
  steps:
  - Screen for unremitting, non-mechanical shoulder, scapular, and medial arm/ulnar border (C8–T1) pain, especially
    in smokers or patients with constitutional symptoms.
  - Examine for intrinsic hand muscle wasting and Horner syndrome (ipsilateral ptosis, miosis, anhidrosis).
  - '"Suspected tumour and malignancy will need urgent referral following the local 2-week cancer referral pathway."'
  positive: '4 cases presenting to orthopaedics: mean diagnostic delay 18.5 months.'
  interpretation: Apical lung tumours frequently present initially to orthopaedic or musculoskeletal clinics with
    shoulder pain, resulting in prolonged diagnostic delay (mean 18.5 months in Bisbinas 1999).
  metrics: 'Bisbinas 1999 Ann R Coll Surg Engl: 4 cases presenting to orthopaedics: mean diagnostic delay 18.5 months.'
  evidence: L
  sources:
