- id: obrien-active-compression-test
  type: test
  title: Active Compression (O’Brien) Test (AC Joint & SLAP)
  page: 4
  summary: Resisted isometric elevation at 90° flexion and horizontal adduction performed first in full internal
    rotation (thumb down) and then in external rotation (palm up).
  steps:
  - Flex the patient’s shoulder to 90° and horizontally adduct slightly across the midline with the elbow extended.
  - 'Step 1 (thumb down): internally rotate the arm fully and apply downward resistance; note whether pain is felt
    "on top" (AC joint) or "deep inside" (labral/SLAP).'
  - 'Step 2 (palm up): supinate/externally rotate the arm and repeat downward resistance; test is positive if pain
    from Step 1 is reduced or eliminated in Step 2.'
  positive: 'active compression (O''Brien) for AC joint: Sn 41%, Sp 95%; all NPV > 94%, PPV < 30% (Chronopoulos
    2004).'
  interpretation: High specificity (Sp 95%) for AC joint pathology when pain is localized directly over the top
    of the AC joint and relieved in the palm-up position. For SLAP lesions, pooled DOR of physical tests is 1.38
    (1.13–1.69) — poor (Gismervik 2017).
  metrics: 'Chronopoulos 2004 Am J Sports Med (Level L): active compression (O''Brien) Sn 41%, Sp 95%; all NPV >
    94%, PPV < 30%. Gismervik 2017 BMC Musculoskelet Disord (Level M, SLAP): pooled DOR of physical tests 1.38 (1.13–1.69)
    — poor.'
  evidence: L
  video_url: https://www.youtube.com/watch?v=qkDvVBi0gg8
  video_title: Active Compression Test of O’Brien — SLAP Lesions & AC Pathology (Physiotutors)
  sources:
  - *id013
