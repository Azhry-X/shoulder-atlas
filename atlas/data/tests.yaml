    url: https://doi.org/10.1001/jama.297.13.1478
    free_full_text: false
  review_status: approved
- id: posterior-shoulder-dislocation
  type: info
  title: Posterior Shoulder Dislocation — Radiographic Pitfalls & Locked ER Loss
  page: 1
  summary: Triage recognition and orthogonal imaging requirement for posterior glenohumeral dislocation.
  steps:
  - Suspect posterior dislocation after seizure, electrocution, or axial load onto an internally rotated, flexed,
    adducted arm.
  - Examine for a fixed internal rotation deformity with complete loss of passive external rotation and prominent
    posterior humeral head.
  - Do not rely on an anteroposterior (AP) radiograph alone (11.4% diagnostic rate); obtain axillary, scapular Y
    view, or CT.
  positive: rare (< 4% of all shoulder dislocations); initial diagnosis missed in 150 patients (73.2%); AP radiograph
    alone gave the right diagnosis in only 19 of 166 (11.4%); axillary / Y view / CT confirmed all 205.
  interpretation: Because initial diagnosis was missed in 73.2% of cases and AP radiographs alone identified only
    11.4%, orthogonal views (axillary / Y view / CT) are mandatory whenever passive ER is locked after trauma.
  metrics: 'Xu 2015 J Orthop Translat (systematic review): rare (< 4% of all shoulder dislocations); initial diagnosis
    missed in 150 patients (73.2%); AP radiograph alone gave the right diagnosis in only 19 of 166 (11.4%); axillary
    / Y view / CT confirmed all 205.'
  evidence: L
  sources:
  - text: Xu 2015 J Orthop Translat (systematic review)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5982360/
    free_full_text: true
  review_status: approved
- id: traumatic-anterior-dislocation-injuries
  type: info
  title: Traumatic Anterior Dislocation — Associated Nerve, Fracture & Cuff Injuries
  page: 1
  summary: BESS/BOA guideline data on nerve injury, greater-tuberosity fracture, age-stratified rotator cuff tears,
    and 6-week EMG follow-up after traumatic anterior dislocation.
  steps:
  - 'Screen peripheral nerve function before and after reduction: clinically apparent neurological injury ≈ 13.5%
    of dislocations (axillary nerve two-thirds); EMG shows nerve injury in 48%.'
  - Check radiographs for greater-tuberosity fracture (≈ 16%).
  - 'Maintain a high index of suspicion for concomitant rotator cuff tears in patients ≥ 40 years: 41% (40–55 y),
    71% (56–70 y), 100% (> 70 y).'
  - '"EMG studies should be performed at 6 weeks if no clinical recovery is seen" → nerve-injury centre referral
    if no recovery.'
  positive: clinically apparent neurological injury ≈ 13.5% of dislocations (axillary nerve two-thirds); EMG shows
    nerve injury in 48%; greater-tuberosity fracture ≈ 16%; rotator cuff tears 41% (40–55 y), 71% (56–70 y), 100%
    (> 70 y). "EMG studies should be performed at 6 weeks if no clinical recovery is seen" → nerve-injury centre
    referral if no recovery.
  interpretation: Persistent deltoid or rotator cuff weakness after traumatic anterior dislocation in patients over
    40 years requires urgent cuff imaging and 6-week EMG if nerve recovery is absent.
  metrics: 'Level: Guideline. Brownson 2015 BESS/BOA traumatic anterior instability pathway: clinically apparent
    neurological injury ≈ 13.5% of dislocations (axillary nerve two-thirds); EMG shows nerve injury in 48%; greater-tuberosity
    fracture ≈ 16%; rotator cuff tears 41% (40–55 y), 71% (56–70 y), 100% (> 70 y). "EMG studies should be performed
    at 6 weeks if no clinical recovery is seen" → nerve-injury centre referral if no recovery.'
  evidence: Guideline
  sources:
  - &id003
    text: Brownson 2015 BESS/BOA traumatic anterior instability pathway
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4935160/
    free_full_text: true
