  review_status: approved
- id: paxinos-ac-tenderness
  type: test
  title: Paxinos Sign & AC Joint Line Tenderness
  page: 4
  summary: Anteroposterior pinch-shear compression of the acromioclavicular joint (Paxinos sign) and direct AC joint-line
    palpation tenderness.
  steps:
  - 'AC joint tenderness: palpate directly over the superior acromioclavicular joint line for focal concordant pain
    (Sn 96%).'
  - 'Paxinos sign: place your thumb under the posterolateral aspect of the acromion and your index/middle fingers
    over the superior mid-distal clavicle, then squeeze to apply anterosuperior acromial and posteroinferior clavicular
    shear (Sn 79%).'
  - Combine high-sensitivity palpation/Paxinos screening with high-specificity O’Brien active compression (Sp 95%).
  positive: AC tenderness Sn 96%; Paxinos Sn 79% — both low specificity (Walton 2004).
  interpretation: Absence of AC joint-line tenderness (Sn 96%) helps rule out the AC joint as the pain source, whereas
    a positive tenderness or Paxinos test has low specificity and must be confirmed with Cross-Body Adduction and
    O’Brien testing.
  metrics: 'Walton 2004 JBJS Am: AC tenderness Sn 96%; Paxinos Sn 79% — both low specificity.'
  evidence: L
  video_url: https://www.youtube.com/watch?v=fiEeyT9VsCc
  video_title: Paxinos Sign — Acromioclavicular (AC) Joint Pathology (Physiotutors)
